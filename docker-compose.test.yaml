version: '3.8'
name: infrastructure-test

services:
  cache:
    image: redis:alpine
    ports:
      - "6378:6378"
    labels:
      - "warden.managed=false"
      - "warden.repo=not-my-cs-project"
  rogue-web:
    image: nginx:alpine
    ports:
      - "8088:80"
  my-rogue-app:
    image: nginx:alpine
    ports:
      - "8089:80"
  my-rogue-app-adopted:
    image: nginx:alpine
    ports:
      - "8089:80"
